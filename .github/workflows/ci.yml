name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - name: format
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: trustd
        working-directory: rust
        run: cargo build --locked -p eh-trustd
      - name: test
        env:
          EH_TRUSTD_BIN: ${{ github.workspace }}/rust/target/debug/eh-trustd
        run: go test -race ./...

  client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
      - name: format
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        working-directory: rust
        run: cargo test --workspace
