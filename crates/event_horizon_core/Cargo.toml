[package]
name = "event_horizon_core"
version = "12.0.0"
edition = "2021"
authors = ["Tyler <tyler@users.noreply.github.com>"]
description = "High-assurance, memory-safe mathematical and virtual machine core for Event Horizon Spec v12"
license = "MIT OR Apache-2.0"

[lib]
name = "event_horizon_core"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
