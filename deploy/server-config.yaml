# Event Horizon Server Configuration (Spec v12)
server:
  port: 8443
  tls:
    min_version: "TLS1.3"
    cert_file: "/etc/event-horizon/certs/server.crt"
    key_file: "/etc/event-horizon/certs/server.key"
  offline_grace_seconds: 2700 # 45 minutes default
  min_protocol_version: 12
  heartbeat_interval_seconds: 900 # 15 minutes

admin:
  mtls_enabled: true
  crl_file: "/etc/event-horizon/admin/crl.pem"
  admin_ca_cert: "/etc/event-horizon/admin/admin_ca.crt"

database:
  path: "/var/lib/event-horizon/event_horizon.db"
  encryption_algorithm: "AES-256-GCM"

telemetry:
  ollama_url: "http://127.0.0.1:11434"
  ai_model: "llama3:latest"
  strict_type_enforcement: true
