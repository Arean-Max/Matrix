<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Dark minimal canvas -->
  <rect width="512" height="512" fill="#0d1117" rx="96" />

  <!-- Outer Ring (Layer 1) -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#238636" stroke-width="8" stroke-dasharray="14 10" />

  <!-- Layer 2 (Shield / Onion slice) -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#3fb950" stroke-width="10" stroke-linecap="round" stroke-dasharray="160 50" />

  <!-- Layer 3 (Inner route) -->
  <circle cx="256" cy="256" r="90" fill="none" stroke="#56d364" stroke-width="12" stroke-linecap="round" stroke-dasharray="110 30" />

  <!-- Core Node -->
  <circle cx="256" cy="256" r="44" fill="#0d1117" stroke="#e6edf3" stroke-width="10" />
  
  <!-- Minimalist 'M' mark at core -->
  <path d="M 238 270 L 238 244 L 256 258 L 274 244 L 274 270" 
        fill="none" 
        stroke="#e6edf3" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Top Connection Vector -->
  <line x1="256" y1="86" x2="256" y2="40" stroke="#3fb950" stroke-width="8" stroke-linecap="round" />
  <circle cx="256" cy="32" r="8" fill="#3fb950" />
</svg>
