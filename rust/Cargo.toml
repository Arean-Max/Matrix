[workspace]
resolver = "2"
members = ["eh-core", "eh-client", "eh-trustd"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
base64 = "0.22"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
strip = "symbols"
